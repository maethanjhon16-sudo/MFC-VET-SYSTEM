services:
  - type: web
    name: mfc-vet-system-fullstack
    runtime: node
    plan: free
    rootDir: vet-system
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
